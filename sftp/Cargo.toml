[package]
name = "sunset-sftp"
version = "0.2.0"
edition = "2024"
license = "0BSD"
repository = "https://github.com/mkj/sunset"
categories = ["network-programming", "embedded", "no-std", "filesystem"]
keywords = ["sftp"]
description = "SFTP for Sunset SSH"

[features]
default = ["async"]

# The `embedded_io_async` layers: `SftpClient` and `SftpServerHandler`.
#
# Without this the crate is entirely synchronous, exposing the protocol
# itself: `SftpRunner`, the packet types, and the encoder. Nothing here
# is pulled in, including the async executor support crates.
async = [
    "dep:embedded-io-async",
    "dep:embassy-futures",
    "dep:bbqueue",
    # for Error::EmbeddedIoError
    "sunset/embedded-io",
]

# Long paths support, which allows paths up to 4096 bytes.
# By default paths are limited to 256 bytes.
long-paths-4096 = []
long-paths-1024 = []

[dependencies]
sunset.workspace = true
sunset-sshwire-derive.workspace = true

num_enum = { version = "0.7.4", default-features = false }
paste = "=1.0.15" # Last released version
log.workspace = true

embedded-io-async = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
bbqueue = { version = "0.7.0", default-features = false, features = [
    "critical-section",
], optional = true }

[dev-dependencies]
embassy-futures.workspace = true
