name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use MSRV from Cargo.toml
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: rust toolchain
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt

      - name: Cache Rust files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/
            ~/.rustup/
          key: rust-cache1-msrv-${{ env.RUSTUP_TOOLCHAIN }}-${{ github.run_id }}
          restore-keys: |
            rust-cache1-msrv-${{ env.RUSTUP_TOOLCHAIN }}

      - name: Format
        run: cargo fmt --check

      # picow is thumbv6m; fuzz wants its own profile and optional sanitizers.
      # --all-features is not a workspace flag here: sunset-sftp's long-path
      # features conflict with each other.
      - name: Test
        run: |
          cargo test --workspace --exclude sunset-demo-picow --exclude sunset-fuzz
          cargo test -p sunset --all-features

      # The SFTP protocol core must stay free of async, so that it can be
      # driven from a blocking loop. This fails if anything in it grows a
      # dependency on the async layer.
      - name: Test sunset-sftp without async
        run: cargo test -p sunset-sftp --no-default-features

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p sunset-client --all-targets
      - run: cargo clippy --locked -p sunset-client --all-targets -- -D warnings
      - name: Disposable SSH route tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          bash client/tests/sshd.sh
