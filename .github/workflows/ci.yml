name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use MSRV from Cargo.toml
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: rust toolchain
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt

      - name: Cache Rust files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/
            ~/.rustup/
          key: rust-cache1-msrv-${{ env.RUSTUP_TOOLCHAIN }}-${{ github.run_id }}
          restore-keys: |
            rust-cache1-msrv-${{ env.RUSTUP_TOOLCHAIN }}

      - name: Format
        run: cargo fmt --check

      # picow is thumbv6m; fuzz wants its own profile and optional sanitizers.
      # --all-features is not a workspace flag here: sunset-sftp's long-path
      # features conflict with each other.
      - name: Test
        run: |
          cargo test --workspace --exclude sunset-demo-picow --exclude sunset-fuzz
          cargo test -p sunset --all-features
