# This is a minimal wrapper around ci.sh
# ci.sh is intended to be usable locally without github.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: rust toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" clippy

      - name: Cache Rust files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/
            ~/.rustup/
            testing/target
          # Save a unique cache each time
          # (https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache)
          key: rust-cache1-msrv-${{ steps.msrv.outputs.version }}-${{ github.run_id }}
          # Load from the most recent match
          restore-keys: |
            rust-cache1-msrv-${{ steps.msrv.outputs.version }}

      - name: build
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: ./testing/ci.sh

      - name: picow bloat
        uses: actions/upload-artifact@v7
        with:
          name: picow-bloat-msrv
          path: ci_out/picow-bloat.txt
